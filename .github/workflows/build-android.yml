name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Godot Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4- name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Export Godot 4.2 APK
        uses: dulvui/godot-android-export@v4.0.0
        with:
          godot-version: '4.2.2'project-directory: 'project'
          export-debug: 'true'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhantomOps-Debug-APK
          path: '**/*.apk'
